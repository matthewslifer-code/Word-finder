<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="WordFinder - find words you can make from your letters.">
  <title>WordFinder - Free Word Finder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="hero">
      <div class="logo">WordFinder</div>
      <p class="tagline">Find words from your letters</p>
    </header>

    <section class="card">
      <h1>FREE WORD FINDER</h1>
      <p class="intro">Enter your letters and discover words you can make.</p>

      <label for="letters">Your letters</label>
      <input
        id="letters"
        type="text"
        maxlength="8"
        autocomplete="off"
        autocapitalize="characters"
        spellcheck="false"
        placeholder="Example: BANDANA"
      >

      <div class="controls">
        <div>
          <label for="minLength">Minimum length</label>
          <select id="minLength">
            <option value="2">2</option>
            <option value="3" selected>3</option>
            <option value="4">4</option>
            <option value="5">5</option>
          </select>
        </div>

        <div>
          <label for="maxLength">Maximum length</label>
          <select id="maxLength">
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8" selected>8</option>
          </select>
        </div>
      </div>

      <button id="findBtn" type="button">Find Words</button>

      <div id="status" class="status" aria-live="polite"></div>
      <div id="results" class="results" aria-live="polite"></div>
    </section>

    <section class="ad-box" aria-label="Advertisement">
      <span>Advertisement</span>
    </section>

    <footer>
      <p>WordFinder • Free word search tool</p>
    </footer>
  </main>

  <script src="words.js"></script>
  <script src="script.js"></script>
</body>
</html>
